<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Inkvoice</title>
  <!-- PRE-LAUNCH: keep the app hidden from search until it's ready. REMOVE this line to go live. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Create invoices, quotes & business cards offline. Free, private, no sign-up.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e3d6b">

  <!-- iOS standalone / Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inkvoice">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=65">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=65">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=65">
  <link rel="shortcut icon" href="favicon.ico?v=65">

  <link rel="stylesheet" href="css/styles.css">
  <script src="vendor/jspdf.umd.min.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <!-- Service worker registration lives HERE, not in app.js, and deliberately uses no
       modules/imports. app.js is the head of a static import graph: if any one module fails
       to load (a partial upload, a typo'd filename) app.js never executes, and when the
       register() call lived inside it the app silently ended up with NO offline cache at all.
       Registered as classic inline JS, it always runs — so the app can still cache itself and
       open offline even if some other file is broken. -->
  <script>
    if('serviceWorker' in navigator){
      // Reload once when a new worker takes control, so a deploy never leaves stale code running.
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!window.__swReloaded){ window.__swReloaded = true; location.reload(); }
      });
      window.addEventListener('load', function(){
        // updateViaCache:'none' → the browser never serves sw.js from its HTTP cache, so a
        // new deploy's worker is detected on the very next load (not up to 7 days later).
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
          .then(function(reg){ return reg.update(); })
          .catch(function(){});
      });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
